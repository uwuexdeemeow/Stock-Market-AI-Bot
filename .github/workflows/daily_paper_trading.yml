# ── Automated Daily Paper Trading ─────────────────────────────────────────────
#
# Runs the Alpaca paper trading pipeline every US trading day.
# Heavy factor data refresh is handled by the separate "Factor Data Refresh"
# workflow so this job can trade from the latest successful cached factor data.
#
# External trigger: cron-job.org calls workflow_dispatch at 9:35 AM New York
# time on weekdays. The daily job also refreshes its short-lived factor-decay
# report from the restored cache, so it cannot submit using yesterday's report.
# GitHub's own cron schedule is intentionally disabled.
#   - 5 minutes after market open so price data is fresh.
#   - daily_run.py has its own NYSE holiday guard (skips holidays automatically).
#
# Manual trigger: go to Actions tab → "Daily Paper Trading" → "Run workflow".
#
# Required secrets (set in repo Settings → Secrets → Actions):
#   ALPACA_API_KEY, ALPACA_SECRET_KEY     — Alpaca paper trading credentials
#   FINNHUB_API_KEY                       — Finnhub market data
#   TRADIER_API_TOKEN                     — Tradier options IV data
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  — Telegram alerts (optional)
#   SMTP_PASSWORD                         — Email alerts (optional)
# ──────────────────────────────────────────────────────────────────────────────

name: Daily Paper Trading
run-name: >-
  Daily Paper Trading (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'dry-run' || 'paper-session' }})

on:
  # cron-job.org and the Actions tab both use this dispatch entry point.
  workflow_dispatch:
    inputs:
      force:
        description: "Run even on weekends/holidays (--force flag)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      allow_repeat_submit:
        description: "Recovery rerun: bypass only the same-day duplicate check"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      allow_outside_execution_window:
        description: "Emergency recovery: permit trading outside 09:35-10:30 New York"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Dry run (show steps without executing)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write   # needed to push signal files to signals/latest branch

concurrency:
  # Daily and shadow workflows both force-push signals/latest. Share one lock so
  # a long daily run cannot overwrite a shadow run that finished mid-pipeline.
  group: signals-latest-publisher
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      # ── 0. DST-safe schedule gate ─────────────────────────────────
      # GitHub cron is UTC, not America/New_York.  We schedule both possible
      # 9:35 AM NY equivalents and skip whichever one is wrong for today's
      # DST offset.  Manual workflow_dispatch runs are always allowed.
      - name: New York schedule gate
        id: ny_schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - running."
            exit 0
          fi

          NY_OFFSET="$(TZ=America/New_York date +%z)"
          TRIGGER="${{ github.event.schedule }}"
          echo "Trigger cron: ${TRIGGER}"
          echo "New York offset now: ${NY_OFFSET}"

          if [ "${TRIGGER}" = "35 13 * * 1-5" ] && [ "${NY_OFFSET}" = "-0400" ]; then
            echo "DST trigger matches 9:35 AM New York - running."
          elif [ "${TRIGGER}" = "35 14 * * 1-5" ] && [ "${NY_OFFSET}" = "-0500" ]; then
            echo "Standard-time trigger matches 9:35 AM New York - running."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Off-season duplicate trigger - skipping trading pipeline."
            exit 0
          fi

          # Do not suppress cron just because a manual run happened earlier.
          # daily_run.py and alpaca_paper_trading.py are idempotent, so they
          # protect against duplicate orders while still proving cron works.
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      # ── 1. Check out the repo ──────────────────────────────────────
      - name: Checkout repository
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/checkout@v7

      # ── 2. Set up Python ───────────────────────────────────────────
      - name: Set up Python 3.12
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ── 3. Cache pip packages (speeds up subsequent runs) ──────────
      - name: Cache pip packages
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-

      # ── 4. Install dependencies ────────────────────────────────────
      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      # ── 5. Restore one validated factor snapshot ───────────────────
      # PLAIN ENGLISH: two independent prefix caches can pair today's prices
      # with yesterday's stress reports. One cache key keeps all evidence from
      # the same successful Factor Data Refresh run. Strategy approvals stay
      # in main and are not restored from the cache.
      - name: Restore validated factor snapshot
        id: restore_validated_factor_snapshot
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            data/
            signals/adaptive_factor_weights.json
            signals/core_satellite_alpha_metrics.json
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/feature_health_profile.json
            signals/feature_health_profile.csv
            signals/feature_research_report.json
            signals/feature_research_summary.csv
            signals/research_run_manifest.json
            logs/feature_ic_shortlist.csv
            logs/survivorship_audit.json
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: validated-factor-snapshot-v2-${{ github.run_id }}
          restore-keys: |
            validated-factor-snapshot-v2-

      - name: Require validated factor snapshot
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        shell: bash
        env:
          MATCHED_KEY: ${{ steps.restore_validated_factor_snapshot.outputs.cache-matched-key }}
        run: |
          # Never trade from a failed research run's data-only cache.
          if [[ "$MATCHED_KEY" != validated-factor-snapshot-v2-* ]]; then
            echo "::error::No validated factor snapshot is cached. Run Factor Data Refresh and inspect its robustness gate."
            exit 1
          fi
          echo "Restored validated snapshot: $MATCHED_KEY"

      # Restore the operational audit trail from the dedicated signal branch.
      # PLAIN ENGLISH: GitHub runners are new computers each day. These files
      # let duplicate protection and fill checks continue from yesterday.
      # The epoch definition itself is tracked on main and must not be restored
      # from signals/latest, because that branch can still contain the prior
      # epoch after a newly frozen epoch is pushed.
      - name: Restore latest paper state
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          git fetch --quiet origin +signals/latest:refs/remotes/origin/signals/latest
          for f in \
              signals/alpaca_paper_equity.csv \
              signals/alpaca_paper_log.csv \
              signals/alpaca_daily_status.json \
              signals/alpaca_slippage_reversal_report.json \
              signals/alpaca_submit_outcome.json \
              signals/alpaca_submit_outcomes.csv \
              signals/execution_cost_calibration.json \
              signals/paper_validation_epoch_status.json \
              signals/fill_monitor.json \
              signals/broker_health.json \
              signals/alpaca_paper_health.json \
              signals/alpaca_execution_scorecard.json \
              signals/broker_truth.csv \
              signals/broker_truth.json \
              signals/alignment_recovery_plan.csv \
              signals/alignment_incident_ledger.csv \
              signals/operational_incident_ledger.csv \
              signals/rebalance_state.json \
              signals/paper_run_manifest.json \
              signals/guard_intraday_state.json \
              signals/regime_history.json \
              signals/regime_changes_log.csv ; do
            mkdir -p "$(dirname "$f")"
            if git show "origin/signals/latest:${f}" > "${f}.restore" 2>/dev/null; then
              mv "${f}.restore" "$f"
            else
              rm -f "${f}.restore"
            fi
          done

      # A brand-new signals/latest branch has no orders yet, so it has no
      # paper log. Create a header-only log before any health or broker step
      # reads it. Later order submissions append real rows to this same file.
      - name: Initialize paper trade log
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("signals/alpaca_paper_log.csv")
          if not path.exists() or path.stat().st_size == 0:
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open("w", newline="", encoding="utf-8") as handle:
                  csv.writer(handle).writerow([
                      "submitted_at", "order_id", "ticker", "side", "quantity",
                      "price", "trade_value", "target_weight", "fill_status",
                  ])
              print("Initialized empty paper trade log.")
          else:
              print("Restored paper trade log is ready.")
          PY

      # ── 6. Write .env from GitHub Secrets ──────────────────────────
      #    Secrets are stored encrypted in repo settings, injected at
      #    runtime.  The .env file is never committed to git.
      - name: Create .env from secrets
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          cat <<'ENVEOF' > .env
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_MAX_GROSS_EXPOSURE=1.00
          ALPACA_ORDER_TYPE=limit
          ALPACA_ALLOW_MARKET_ORDER_OVERRIDE=0
          ALPACA_LIMIT_REFERENCE=quote
          ALPACA_LIMIT_OFFSET_BPS_ETF=5
          ALPACA_LIMIT_OFFSET_BPS_OVERLAY=12
          ALPACA_TWO_STAGE_EXECUTION=1
          ALPACA_EXECUTION_STAGE1_WAIT_SECONDS=15
          ALPACA_EXECUTION_STAGE_POLL_SECONDS=1
          ALPACA_EXECUTION_CANCEL_WAIT_SECONDS=10
          ALPACA_EXECUTION_STAGE2_OFFSET_BPS_ETF=1
          ALPACA_EXECUTION_STAGE2_OFFSET_BPS_OVERLAY=3
          ALPACA_EXECUTION_QUOTE_MAX_AGE_SECONDS=5
          ALPACA_DATA_FEED=${{ vars.ALPACA_DATA_FEED || 'iex' }}
          ALPACA_SPREAD_GUARD_QUOTE_RETRIES=4
          ALPACA_SPREAD_GUARD_RETRY_SECONDS=2
          ALPACA_SELL_QUOTE_ATTEMPTS=12
          ALPACA_SELL_QUOTE_RETRY_SECONDS=15
          ALPACA_EXECUTION_WINDOW_START=09:35
          ALPACA_EXECUTION_WINDOW_END=10:30
          ALPACA_EXECUTION_SYMBOL_MIN_SAMPLES=5
          ALPACA_EXECUTION_RISK_ENABLED=1
          ALPACA_EXECUTION_RISK_REPORT_MAX_AGE_HOURS=168
          ALPACA_EXECUTION_RISK_WARN_SCORE=40
          ALPACA_EXECUTION_RISK_HIGH_SCORE=60
          ALPACA_EXECUTION_RISK_WARN_BUY_SCALE=0.75
          ALPACA_EXECUTION_RISK_HIGH_BUY_SCALE=0.50
          # Experimental ATR/vol sizing stays off until separate OOS proof.
          ALPACA_LIVE_RISK_CAP_ENABLED=0
          ALPACA_OVERLAY_STOP_MODE=trailing
          ALPACA_ENABLE_EXPERIMENTAL_ATR_STOPS=0
          ALPACA_EXECUTION_SCORECARD_THROTTLE=1
          ALPACA_EXECUTION_SCORECARD_MAX_AGE_HOURS=72
          ALPACA_EXECUTION_SCORECARD_FAIL_BUY_SCALE=0.75
          ALPACA_EXECUTION_SCORECARD_SEVERE_SCORE=50
          ALPACA_EXECUTION_SCORECARD_SEVERE_BUY_SCALE=0.50
          EXECUTION_SCORECARD_MAX_AVG_SLIPPAGE_BPS=10
          EXECUTION_SCORECARD_MAX_BAD_SLIPPAGE_RATE=0.60
          EXECUTION_SCORECARD_BAD_SLIPPAGE_BPS=2
          EXECUTION_SCORECARD_MIN_FILL_RATE=0.80
          EXECUTION_SCORECARD_MAX_SKIPPED_RATE=0.35
          EXECUTION_SCORECARD_MAX_ADVERSE_15M_RATE=0.60
          EXECUTION_SCORECARD_MAX_ADVERSE_60M_RATE=0.70
          EXECUTION_SCORECARD_LOOKBACK_DAYS=30
          EXECUTION_SCORECARD_WARN_AVG_SLIPPAGE_BPS=5
          EXECUTION_SCORECARD_WARN_BAD_SLIPPAGE_RATE=0.40
          EXECUTION_SCORECARD_MIN_REBALANCE_FILLS=20
          EXECUTION_SCORECARD_MIN_REBALANCE_SESSIONS=3
          BROKER_TRUTH_QTY_TOLERANCE=0.001
          BROKER_TRUTH_WEIGHT_TOLERANCE=0.02
          BROKER_TRUTH_GROSS_EXPOSURE_TOLERANCE=0.05
          BROKER_TRUTH_ALIGNMENT_WAIT_SECONDS=90
          BROKER_TRUTH_ALIGNMENT_POLL_SECONDS=5
          BROKER_TRUTH_REQUIRE_LIVE_ORDERS=0
          ALPACA_BROKER_TRUTH_GATE=1
          ALPACA_BROKER_TRUTH_BLOCK_BUYS_ON_FAIL=1
          ALPACA_REQUIRE_QUOTE_FOR_SUBMIT=1
          MAX_SPREAD_PCT_ETF=0.001
          MAX_SPREAD_PCT_OVERLAY=0.005
          ALPACA_ALLOW_CLOSED_MARKET_QUEUE=0
          ALPACA_SKIP_BUYS_UNTIL_SELLS_FILLED=1
          ALPACA_SKIP_BUYS_WHEN_CASH_BELOW=0
          ALPACA_BUY_CASH_BUFFER_PCT=0.005
          ALPACA_BUY_CASH_BUFFER_DOLLARS=0
          ALPACA_SELL_FILL_WAIT_SECONDS=20
          ALPACA_SELL_FILL_POLL_SECONDS=2
          ALPACA_BUY_FILL_WAIT_SECONDS=20
          ALPACA_BUY_FILL_POLL_SECONDS=2
          ALPACA_MARGIN_WARN_GROSS=1.02
          TQQQ_FAST_DD_FAIL_CLOSED=1
          SPREAD_GUARD_ALERT_TTL_HOURS=20
          GUARD_REPLACE_STALE_SELLS=1
          GUARD_REPLACE_STALE_SELL_OFFSET_BPS=20
          GUARD_BROKER_TRUTH_REFRESH=1
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          TRADIER_API_TOKEN=${{ secrets.TRADIER_API_TOKEN }}
          TRADIER_USE_SANDBOX=0
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED=0
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM=${{ secrets.SMTP_USER }}
          ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }}
          PAPER_MODE_STRATEGY=core_satellite_alpha
          PAPER_SIGNAL_TIMEZONE=Asia/Singapore
          SENTIMENT_ENGINE_LEVEL=vader
          STOCKBOT_SKIP_RESEARCH_SENTIMENT=1
          RESEARCH_INCREMENTAL_WORKERS=4
          PAPER_GAUNTLET_MAX_AVG_SLIPPAGE_BPS=10
          PAPER_HEALTH_MAX_AVG_SLIPPAGE_BPS=10
          PAPER_HEALTH_MAX_DRAWDOWN_WARN_PCT=-5
          PAPER_HEALTH_CORE_TICKERS=SPY,QQQ,TQQQ
          PAPER_HEALTH_MAX_CORE_TICKER_WEIGHT=0.65
          PAPER_HEALTH_MAX_TICKER_WEIGHT=0.35
          PAPER_HEALTH_MAX_SECTOR_WEIGHT=0.50
          PAPER_HEALTH_STALE_OPEN_ORDER_MINUTES=60
          PAPER_HEALTH_MAX_EQUITY_DAILY_MOVE_WARN_PCT=25
          GUARD_CORE_STOP=1
          GUARD_CORE_TICKERS=SPY,QQQ,TQQQ
          GUARD_CORE_TRAIL_PCT=0.05
          GUARD_TQQQ_TRAIL_PCT=0.10
          GUARD_STALE_CANCEL=1
          GUARD_STALE_MINUTES=90
          GUARD_PNL_MONITOR=1
          GUARD_PNL_WARN_PCT=-3.0
          GUARD_PNL_HALT_PCT=-8.0
          GUARD_INTERVAL_SEC=300
          GUARD_ALERTS=1
          ENVEOF

      # ── 6b. Pre-flight health check ────────────────────────────────
      #    Verify Alpaca API is reachable before burning 20+ minutes on
      #    data download + feature build.  Fail fast if credentials are
      #    wrong or Alpaca is having an outage.
      - name: Pre-flight API health check
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 -c "
          import os, sys
          from dotenv import load_dotenv
          load_dotenv()

          # -- Alpaca connectivity (uses the same alpaca-py adapter as the bot) --
          try:
              from alpaca_sdk_adapter import AlpacaPyRESTCompat
              api = AlpacaPyRESTCompat(
                  key_id=os.environ['ALPACA_API_KEY'],
                  secret_key=os.environ['ALPACA_SECRET_KEY'],
                  base_url='https://paper-api.alpaca.markets',
              )
              acct = api.get_account()
              print(f'✓ Alpaca OK — equity: \${float(acct.equity):,.0f}')
          except Exception as e:
              print(f'✗ Alpaca health check FAILED: {e}')
              sys.exit(1)

          # -- Finnhub connectivity (optional but warn) --
          try:
              import requests
              r = requests.get(
                  'https://finnhub.io/api/v1/quote',
                  params={'symbol': 'AAPL', 'token': os.environ.get('FINNHUB_API_KEY', '')},
                  timeout=10
              )
              if r.status_code == 200 and r.json().get('c', 0) > 0:
                  print(f'✓ Finnhub OK')
              else:
                  print(f'⚠ Finnhub returned unexpected response (non-fatal)')
          except Exception as e:
              print(f'⚠ Finnhub check failed (non-fatal): {e}')
          "
        env:
          PYTHONUNBUFFERED: "1"

      # ── 6c. Check the restored research snapshot ───────────────────
      # A partial rebuild during the trading job would have no matching stress
      # reports and can take past the execution cutoff. The factor workflow
      # owns that rebuild and must publish one validated snapshot first.
      - name: Validate restored factor data
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        run: |
          if ! python3 factor_data_health.py --strict --no-write; then
            echo "::error::Validated factor snapshot is stale or unhealthy. Complete Factor Data Refresh before trading."
            exit 1
          fi
        env:
          PYTHONUNBUFFERED: "1"

      # ── 6d. Repair ETF bars before the standalone decay monitor ───
      #    The main daily pipeline refreshes ETFs later, but this earlier
      #    monitor also reads QQQ/SPY. Check yesterday's close first so an
      #    incomplete provider row cannot crash the monitor or enter signals.
      - name: Refresh ETF reference prices for daily factor-decay
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        run: python3 refresh_etf_data.py --refresh --force --strict
        env:
          PYTHONUNBUFFERED: "1"

      - name: Record final daily price fingerprint
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        run: |
          # Update the input manifest after the ETF refresh. Otherwise its
          # checksums still describe the earlier cached ETF files.
          python3 research_output_guard.py \
            --write-manifest \
            --command "github-actions daily_paper_trading etf_preflight"
        env:
          PYTHONUNBUFFERED: "1"

      # ── 6e. Recheck robustness against the final ETF prices ─────────
      # ETF providers can revise even completed bars. Regenerate every report
      # after the one strict ETF refresh so all fingerprints identify the same
      # prices before daily_run.py generates a signal.
      - name: Refresh approved-config validation for daily snapshot
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        run: python3 core_satellite_alpha.py --validation-refresh
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Refresh execution stress for daily snapshot
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        run: python3 core_satellite_execution_stress.py
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Refresh survivorship review for daily snapshot
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        run: python3 core_satellite_survivorship_audit.py
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Refresh factor-decay evidence for daily cache
        id: refresh_daily_factor_decay
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: python3 factor_decay_monitor.py
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Verify daily robustness and matching data
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        run: |
          python3 robustness_review.py --strict
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation_bundle import current_robustness_evidence, load_dataset_context

          # PLAIN ENGLISH: all three safety reports must describe the exact
          # approved strategy and the exact price snapshot this job will use.
          approved = json.loads(Path('signals/core_satellite_validation_bundle.json').read_text())
          dataset = load_dataset_context()
          review = current_robustness_evidence(
              expected_config_fingerprint=str(approved.get('config_fingerprint', '')),
              expected_dataset_fingerprint=str(dataset.get('dataset_fingerprint', '')),
              expected_config=approved.get('config', {}),
          )
          print(json.dumps(review, indent=2))
          raise SystemExit(0 if dataset.get('dataset_fingerprint') and review.get('pass') else 1)
          PY
        env:
          PYTHONUNBUFFERED: "1"

      # ── 7. Run the daily pipeline ─────────────────────────────────
      #    Uses the latest restored factor data/report.  core_satellite_alpha.py
      #    still blocks orders if that data is too stale.
      - name: Run daily paper trading (Alpaca only)
        id: run_daily_paper
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          # The strict ETF preflight and matching robustness reports above
          # already ran on this runner; another refresh would change their ID.
          FLAGS="--alpaca --timeout 900 --skip-refresh"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ github.event.inputs.allow_repeat_submit }}" = "true" ]; then
            FLAGS="$FLAGS --allow-repeat-submit"
          fi
          if [ "${{ github.event.inputs.allow_outside_execution_window }}" = "true" ]; then
            FLAGS="$FLAGS --allow-outside-execution-window"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          # Run the trading pipeline exactly once.  PLAIN ENGLISH: a failed
          # attempt may already have submitted some orders.  Retrying the whole
          # pipeline could return "already submitted" and turn a partial broker
          # failure into a misleading green workflow.  A nonzero exit now stays
          # failed so the operator can reconcile the account safely.
          python3 daily_run.py $FLAGS
        env:
          PYTHONUNBUFFERED: "1"

      - name: Write workflow heartbeat
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          MARKET_CLOSED: ${{ steps.run_daily_paper.outputs.market_closed }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          Path("signals").mkdir(exist_ok=True)
          payload = {
              "workflow": "Daily Paper Trading",
              "workflow_file": "daily_paper_trading.yml",
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "schedule": os.environ.get("SCHEDULE_CRON") or None,
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "run_url": os.environ.get("RUN_URL"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "status": os.environ.get("WORKFLOW_STATUS"),
              "market_closed": os.environ.get("MARKET_CLOSED") == "true",
              "completed_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }
          Path("signals/workflow_heartbeat_daily.json").write_text(json.dumps(payload, indent=2))
          PY

      - name: Record intentional skip
        if: ${{ always() && (steps.ny_schedule_gate.outputs.should_run == 'false' || steps.run_daily_paper.outputs.market_closed == 'true') }}
        env:
          SKIP_REASON: ${{ steps.ny_schedule_gate.outputs.should_run == 'false' && 'schedule_guard' || 'market_closed' }}
        run: |
          # Runner Python is available even when the schedule skips checkout.
          python3 - <<'PY_SKIP'
          import json, os
          from pathlib import Path
          Path("skip-evidence").mkdir(exist_ok=True)
          Path("skip-evidence/workflow_skip.json").write_text(json.dumps({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": os.environ["GITHUB_SHA"],
              "reason": os.environ["SKIP_REASON"], "orders_submitted": False
          }))
          PY_SKIP

      - name: Upload skip evidence
        if: ${{ always() && (steps.ny_schedule_gate.outputs.should_run == 'false' || steps.run_daily_paper.outputs.market_closed == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: intentional-skip-${{ github.run_id }}
          path: skip-evidence/workflow_skip.json
          retention-days: 30

      # ── 8. Upload logs as artifact (viewable in Actions tab) ───────
      - name: Upload closed-market metadata
        if: ${{ steps.run_daily_paper.outputs.market_closed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: closed-market-${{ github.run_number }}
          path: |
            ${{ steps.run_daily_paper.outputs.closed_market_log }}
            signals/workflow_heartbeat_daily.json
          retention-days: 60

      - name: Upload run logs
        if: ${{ steps.run_daily_paper.outputs.market_closed != 'true' && always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: daily-run-logs-${{ github.run_number }}
          path: |
            logs/
            signals/core_satellite_alpha_signal.csv
            signals/core_satellite_alpha_input_snapshot.csv
            signals/core_satellite_alpha_orders.csv
            signals/core_satellite_alpha_metrics.json
            signals/alpaca_paper_equity.csv
            signals/alpaca_paper_log.csv
            signals/alpaca_daily_status.json
            signals/alpaca_slippage_reversal_report.json
            signals/adaptive_factor_weights.json
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/feature_health_profile.json
            signals/feature_health_profile.csv
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            signals/fill_monitor.json
            signals/broker_health.json
            signals/alpaca_paper_health.json
            signals/alpaca_execution_scorecard.json
            signals/alpaca_submit_outcome.json
            signals/alpaca_submit_outcomes.csv
            signals/execution_cost_calibration.json
            signals/paper_validation_epoch.json
            signals/paper_validation_epoch_status.json
            signals/broker_truth.csv
            signals/broker_truth.json
            signals/alignment_recovery_plan.csv
            signals/alignment_incident_ledger.csv
            signals/operational_incident_ledger.csv
            signals/rebalance_state.json
            signals/paper_run_manifest.json
            signals/guard_intraday_state.json
            signals/regime_history.json
            signals/regime_changes_log.csv
            signals/monitor_heartbeat.json
            signals/shadow_paper_journal.csv
            signals/shadow_paper_equity.csv
            signals/paper_shadow_compare.csv
            signals/paper_shadow_compare.json
            signals/fractional_shadow_state.json
            signals/fractional_shadow_orders.csv
            signals/fractional_shadow_equity.csv
            signals/fractional_shadow_report.json
            signals/fractional_shadow_compare.csv
            signals/fractional_shadow_compare.json
            signals/workflow_heartbeat_daily.json
            signals/workflow_heartbeat_shadow.json
          retention-days: 60

      # ── 9. Commit signal files back to repo (signals/latest branch) ─
      #    PLAIN ENGLISH: Push today's signal files to a dedicated branch
      #    so you can git pull them locally as a failsafe.  This creates
      #    a commit history of every day's signals for audit/review.
      #    Uses the built-in GITHUB_TOKEN (no extra secrets needed).
      #
      #    Skipped on dry-run since no signal files are generated.
      - name: Commit signals to repo
        if: ${{ steps.run_daily_paper.outputs.market_closed != 'true' && always() && github.event.inputs.dry_run != 'true' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        run: |
          # Never replace signals/latest with a mixed or partial daily bundle.
          # Failed-but-complete evidence is publishable for diagnosis; missing
          # or mismatched evidence stays only in the run artifact.
          if ! python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("signals/paper_run_manifest.json")
          payload = json.loads(path.read_text()) if path.exists() else {}
          if payload.get("status") != "complete":
              raise SystemExit("Evidence manifest is incomplete; refusing signals/latest publication")
          print(f"Publishing complete evidence run {payload.get('run_id')}")
          PY
          then
            # The trading step already owns the job failure. Refusing to publish
            # partial evidence is expected cleanup behavior, not a second fault.
            echo "::notice::Evidence manifest is incomplete; signals/latest was not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy generated evidence outside the checkout before switching.
          # Build on the existing shared branch so prior runs and files owned
          # by the shadow/post-market jobs remain available for recovery.
          generated_dir="$(mktemp -d)"
          source_commit="$(git rev-parse HEAD)"
          cp -R signals "$generated_dir/signals"
          cp -R logs "$generated_dir/logs"
          git stash push --include-untracked --message "daily generated evidence"
          git fetch --quiet origin +signals/latest:refs/remotes/origin/signals/latest
          git checkout -B signals/latest origin/signals/latest

          # Add each expected file ONLY if it actually exists (dry-run, partial
          # failure, or a not-yet-implemented step may leave some missing).
          added=0
          for f in \
              signals/core_satellite_alpha_signal.csv \
              signals/core_satellite_alpha_input_snapshot.csv \
              signals/core_satellite_alpha_orders.csv \
              signals/core_satellite_alpha_metrics.json \
              signals/alpaca_paper_equity.csv \
              signals/alpaca_paper_log.csv \
              signals/alpaca_daily_status.json \
              signals/alpaca_slippage_reversal_report.json \
              logs/etf_data_health.json \
              signals/factor_data_health.json \
              signals/factor_decay_monitor.csv \
              signals/fill_monitor.json \
              signals/broker_health.json \
              signals/alpaca_paper_health.json \
              signals/alpaca_execution_scorecard.json \
              signals/alpaca_submit_outcome.json \
              signals/alpaca_submit_outcomes.csv \
              signals/execution_cost_calibration.json \
              signals/paper_validation_epoch.json \
              signals/paper_validation_epoch_status.json \
              signals/broker_truth.csv \
              signals/broker_truth.json \
              signals/alignment_recovery_plan.csv \
              signals/alignment_incident_ledger.csv \
              signals/operational_incident_ledger.csv \
              signals/rebalance_state.json \
              signals/paper_run_manifest.json \
              signals/guard_intraday_state.json \
              signals/regime_history.json \
              signals/regime_changes_log.csv \
              signals/monitor_heartbeat.json \
              signals/workflow_heartbeat_daily.json ; do
            if [ -f "$generated_dir/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "$generated_dir/$f" "$f"
              git add -f "$f"
              added=$((added + 1))
            else
              echo "  skipping missing file: $f"
            fi
          done
          # daily_run_*.json logs use a glob — only add what's there
          for source in "$generated_dir"/logs/daily_run_*.json "$generated_dir"/logs/alpaca_execution_scorecard_*.json "$generated_dir"/logs/broker_truth_*.json; do
            f="${source#"$generated_dir/"}"
            if [ -f "$generated_dir/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "$generated_dir/$f" "$f"
              git add -f "$f"
              added=$((added + 1))
            fi
          done
          for source in "$generated_dir"/logs/factor_decay_monitor.json "$generated_dir"/logs/core_satellite_execution_stress.json "$generated_dir"/logs/core_satellite_survivorship_audit.json "$generated_dir"/logs/alpaca_paper_health_*.json; do
            f="${source#"$generated_dir/"}"
            if [ -f "$generated_dir/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "$generated_dir/$f" "$f"
              git add -f "$f"
              added=$((added + 1))
            fi
          done

          if [ "$added" -eq 0 ]; then
            echo "  no signal files to commit — skipping"
            exit 0
          fi
          git commit -m "signals: $(date -u +%Y-%m-%d) daily run #${{ github.run_number }}" || echo "No signal changes to commit"
          git push origin signals/latest
          # Run later diagnostics from today's source, not the historical
          # helper scripts stored on the evidence-only branch.
          git checkout --detach "$source_commit"
          cp -R "$generated_dir/signals/." signals/
          cp -R "$generated_dir/logs/." logs/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. Upload updated data cache ──────────────────────────────
      #    Save any new parquet data so the next run starts with it.
      - name: Save data cache
        if: ${{ steps.run_daily_paper.outputs.market_closed != 'true' && success() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v6
        with:
          path: data/
          # PLAIN ENGLISH: use the same prefix restored near the start of this
          # workflow, so today's validated data can warm the next daily run.
          key: factor-data-parquets-daily-${{ github.run_id }}

      # ── 10. Save updated state files ──────────────────────────────
      #    Preserve the validated factor/report set under a new immutable cache
      #    key. Strategy approval files remain owned by main.
      - name: Save state files cache
        if: ${{ steps.run_daily_paper.outputs.market_closed != 'true' && success() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v6
        with:
          path: |
            signals/core_satellite_alpha_metrics.json
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/feature_health_profile.json
            signals/feature_health_profile.csv
            signals/feature_research_report.json
            signals/feature_research_summary.csv
            signals/research_run_manifest.json
            logs/feature_ic_shortlist.csv
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: runtime-state-v4-${{ github.run_id }}

      # ── 11. One consolidated Telegram summary ──────────────────────
      #    Python scripts suppress their own Telegram messages in Actions
      #    (`STOCKBOT_SCRIPT_TELEGRAM_ENABLED=0`), so this is the only
      #    Telegram message sent by the workflow.
      - name: Send consolidated Telegram summary
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          MARKET_CLOSED: ${{ steps.run_daily_paper.outputs.market_closed }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set — skipping notification"
            exit 0
          fi

          python3 - <<'PY' > /tmp/telegram_summary.txt
          import csv
          import glob
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = os.environ.get("JOB_STATUS", "unknown")
          label = {
              "success": "OK",
              "failure": "FAILED",
              "cancelled": "CANCELLED",
          }.get(status, status.upper())
          # Use datetime.now(timezone.utc) instead of os.popen("date -u ...").
          # Python 3.12 rejects backslash-escaped quotes inside f-strings as a
          # SyntaxError; the equivalent shell-out broke the workflow.
          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          lines = [
              f"Daily Paper Trading {label}",
              f"Run #{os.environ.get('RUN_NUMBER', '?')}: {os.environ.get('RUN_URL', '')}",
              f"Time: {now_str}",
          ]
          if os.environ.get("MARKET_CLOSED") == "true":
              lines[0] = "Daily Paper Trading MARKET CLOSED" if status == "success" else lines[0]
              lines.append("NYSE closed: trading skipped; no orders submitted by this run.")
              print("\n".join(lines))
              raise SystemExit(0)

          if os.environ.get("DRY_RUN_INPUT") == "true":
              lines.append("Mode: dry-run")

          logs = sorted(glob.glob("logs/daily_run_*.json"), key=lambda p: Path(p).stat().st_mtime if Path(p).exists() else 0)
          if logs:
              path = logs[-1]
              try:
                  data = json.loads(Path(path).read_text())
                  ok = data.get("steps_ok", "?")
                  total = data.get("steps_total", "?")
                  failed = data.get("steps_failed", 0)
                  elapsed = data.get("total_elapsed_seconds", "?")
                  lines.append(f"Steps: {ok}/{total} ok, failed={failed}, elapsed={elapsed}s")
                  bad = [r for r in data.get("results", []) if r.get("status") not in {"ok", "skipped"}]
                  if bad:
                      lines.append("Failures:")
                      for row in bad[:8]:
                          suffix = f" by {row.get('blocked_by')}" if row.get("blocked_by") else ""
                          lines.append(f"- {row.get('name')}: {row.get('status')}{suffix}")
                      if len(bad) > 8:
                          lines.append(f"- ... +{len(bad) - 8} more")
              except Exception as exc:
                  lines.append(f"Daily log unreadable: {exc}")
          else:
              lines.append("Daily log: missing")

          signal_path = Path("signals/core_satellite_alpha_signal.csv")
          if signal_path.exists():
              try:
                  rows = list(csv.DictReader(signal_path.open()))
                  row = rows[0] if rows else {}
                  lines.append(f"paper_ready: {row.get('paper_ready', '?')}")
                  lines.append(f"regime: {row.get('current_regime', '?')} | gross: {row.get('gross_exposure', '?')}")
                  if row.get("reason"):
                      lines.append(f"reason: {row.get('reason')}")
              except Exception as exc:
                  lines.append(f"Signal unreadable: {exc}")

          orders_path = Path("signals/core_satellite_alpha_orders.csv")
          if orders_path.exists():
              try:
                  with orders_path.open() as f:
                      order_count = max(sum(1 for _ in f) - 1, 0)
                  lines.append(f"Planned orders: {order_count}")
              except Exception:
                  pass

          trade_log_path = Path("signals/alpaca_paper_log.csv")
          if trade_log_path.exists():
              try:
                  today_utc = datetime.now(timezone.utc).date()
                  rows = []
                  for row in csv.DictReader(trade_log_path.open()):
                      submitted_at = row.get("submitted_at", "")
                      try:
                          submitted_date = datetime.fromisoformat(
                              submitted_at.replace("Z", "+00:00")
                          ).astimezone(timezone.utc).date()
                      except Exception:
                          submitted_date = today_utc
                      if submitted_date == today_utc:
                          rows.append(row)

                  if rows:
                      accepted = [
                          r for r in rows
                          if str(r.get("order_id", "")).strip()
                          and not str(r.get("order_id", "")).startswith("ERROR")
                          and not str(r.get("order_id", "")).startswith("SKIPPED")
                          and str(r.get("fill_status", "")).lower() != "skipped"
                      ]
                      filled = [
                          r for r in rows
                          if str(r.get("fill_status", "")).lower() == "filled"
                      ]
                      skipped = [
                          r for r in rows
                          if str(r.get("order_id", "")).startswith("SKIPPED")
                          or str(r.get("fill_status", "")).lower() == "skipped"
                      ]
                      failed = [
                          r for r in rows
                          if str(r.get("order_id", "")).startswith("ERROR")
                          or not str(r.get("order_id", "")).strip()
                          or str(r.get("fill_status", "")).lower() in {"submission_failed", "rejected"}
                      ]
                      lines.append(
                          f"Alpaca accepted: {len(accepted)} | filled: {len(filled)} | failed: {len(failed)} | skipped: {len(skipped)}"
                      )
                  else:
                      lines.append("Alpaca accepted: 0 | filled: 0 | failed: 0 | skipped: 0")
              except Exception as exc:
                  lines.append(f"Alpaca order log unreadable: {exc}")

          broker_truth_path = Path("signals/broker_truth.json")
          health_path = Path("signals/alpaca_paper_health.json")
          if health_path.exists():
              try:
                  health = json.loads(health_path.read_text())
                  readiness = health.get("readiness", {}) or {}
                  lines.append(
                      "Canonical readiness: "
                      f"{readiness.get('status', '?')} | "
                      f"reason={readiness.get('reason', '?')} | "
                      f"run={health.get('run_id', '?')}"
                  )
                  blockers = readiness.get("blockers", []) or []
                  if blockers:
                      lines.append("Blockers: " + ", ".join(str(item) for item in blockers[:4]))
              except Exception as exc:
                  lines.append(f"Paper readiness unreadable: {exc}")

          if broker_truth_path.exists():
              try:
                  truth = json.loads(broker_truth_path.read_text())
                  summary = truth.get("summary", {})
                  lines.append(
                      "Broker truth: "
                      f"{truth.get('status', '?')} | "
                      f"fail={summary.get('fail_count', '?')} | "
                      f"warn={summary.get('warning_count', '?')}"
                  )
                  alignment = summary.get("alignment", {}) or {}
                  recovery = summary.get("alignment_recovery_plan", {}) or {}
                  incidents = summary.get("alignment_incident_ledger", {}) or {}
                  lines.append(
                      "Account alignment: "
                      f"{alignment.get('status', '?')} | "
                      f"max_gap={alignment.get('maximum_target_weight_gap', '?')} | "
                      f"reason={alignment.get('reason', '?')} | "
                      f"recovery_rows={recovery.get('row_count', 0)} | "
                      f"open_incidents={incidents.get('open_incidents', 0)}"
                  )
              except Exception as exc:
                  lines.append(f"Broker truth unreadable: {exc}")

          equity_path = Path("signals/alpaca_paper_equity.csv")
          if equity_path.exists():
              try:
                  rows = list(csv.DictReader(equity_path.open()))
                  if rows:
                      lines.append(f"Equity: ${rows[-1].get('equity', '?')}")
              except Exception:
                  pass

          print("\n".join(lines))
          PY

          cat /tmp/telegram_summary.txt
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text@/tmp/telegram_summary.txt" \
            || echo "⚠ Telegram notification failed (non-fatal)"

      - name: Publish detailed failure annotation
        if: ${{ failure() }}
        env:
          WORKFLOW_STEPS_JSON: ${{ toJSON(steps) }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 workflow_failure_annotation.py --workflow-file .github/workflows/daily_paper_trading.yml --workflow-name "Daily Paper Trading" --detail-log-glob "logs/daily_run_*.json"
