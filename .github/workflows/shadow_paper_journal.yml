name: Shadow Paper Journal

on:
  schedule:
    # 9:55 AM New York, shortly after the normal paper workflow.
    - cron: "55 13 * * 1-5"
    - cron: "55 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even on weekends/holidays"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ignore_stale:
        description: "Allow stale factor data for debugging"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      fractional_initial_equity:
        description: "Pretend fractional account size in US dollars"
        required: false
        default: "400"
        type: string

permissions:
  contents: write

concurrency:
  # Daily and shadow workflows both force-push signals/latest. Share one lock so
  # whichever starts second waits and preserves the first workflow's files.
  group: signals-latest-publisher
  cancel-in-progress: false

jobs:
  shadow-paper-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: New York schedule gate
        id: ny_schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NY_OFFSET="$(TZ=America/New_York date +%z)"
          TRIGGER="${{ github.event.schedule }}"
          if [ "${TRIGGER}" = "55 13 * * 1-5" ] && [ "${NY_OFFSET}" = "-0400" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${TRIGGER}" = "55 14 * * 1-5" ] && [ "${NY_OFFSET}" = "-0500" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Cache data directory
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: data/
          key: shadow-factor-reader-${{ github.run_id }}
          restore-keys: |
            factor-data-parquets-

      # Factor Refresh owns these generated runtime inputs. Shadow may read the
      # newest healthy copy, but it must not mix them into its journal cache.
      - name: Restore factor runtime state
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            signals/core_satellite_alpha_metrics.json
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
          key: shadow-runtime-reader-${{ github.run_id }}
          restore-keys: |
            runtime-state-v2-

      # PLAIN ENGLISH: this cache contains only the shadow account's own
      # journal. Approved validation reports stay exactly as checked out from
      # main, so an old cache cannot replace them and falsely block trading.
      - name: Cache shadow journal state
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            signals/shadow_paper_journal.csv
            signals/shadow_paper_equity.csv
            signals/fractional_shadow_state.json
            signals/fractional_shadow_orders.csv
            signals/fractional_shadow_equity.csv
            signals/fractional_shadow_report.json
            signals/fractional_shadow_compare.csv
            signals/fractional_shadow_compare.json
          key: shadow-journal-v2-${{ github.run_id }}
          restore-keys: |
            shadow-journal-v2-

      - name: Restore prior shadow files from signals/latest
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          git fetch --quiet origin signals/latest:refs/remotes/origin/signals/latest || true
          mkdir -p signals
          for f in \
            signals/core_satellite_alpha_signal.csv \
            signals/shadow_paper_journal.csv \
            signals/shadow_paper_equity.csv \
            signals/fractional_shadow_state.json \
            signals/fractional_shadow_orders.csv \
            signals/fractional_shadow_equity.csv \
            signals/fractional_shadow_report.json \
            signals/fractional_shadow_compare.csv \
            signals/fractional_shadow_compare.json ; do
            tmp_file="$(mktemp)"
            if git show "origin/signals/latest:${f}" > "$tmp_file" 2>/dev/null && [ -s "$tmp_file" ]; then
              mv "$tmp_file" "$f"
              echo "Restored existing ${f} from signals/latest."
            else
              rm -f "$tmp_file" "$f"
              echo "No non-empty prior ${f} found on signals/latest."
            fi
          done

      # Shadow checks read the real paper-trade history. On the first run that
      # history is empty, not broken, so make a CSV with column names instead
      # of letting a missing file stop the workflow.
      - name: Initialize paper trade log
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("signals/alpaca_paper_log.csv")
          if not path.exists() or path.stat().st_size == 0:
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open("w", newline="", encoding="utf-8") as handle:
                  csv.writer(handle).writerow([
                      "submitted_at", "order_id", "ticker", "side", "quantity",
                      "price", "trade_value", "target_weight", "fill_status",
                  ])
              print("Initialized empty paper trade log.")
          else:
              print("Paper trade log is ready.")
          PY

      - name: Create .env from secrets
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          cat <<'ENVEOF' > .env
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          TRADIER_API_TOKEN=${{ secrets.TRADIER_API_TOKEN }}
          TRADIER_USE_SANDBOX=0
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED=0
          PAPER_MODE_STRATEGY=core_satellite_alpha
          PAPER_SIGNAL_TIMEZONE=Asia/Singapore
          SENTIMENT_ENGINE_LEVEL=vader
          ENVEOF

      - name: Weekend and holiday guard
        id: calendar_gate
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force requested; skipping calendar guard."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import daily_run

          now = datetime.now(ZoneInfo("America/New_York"))
          if now.weekday() >= 5:
              print("Weekend in New York; skipping shadow journal.")
              raise SystemExit(2)
          if daily_run._is_us_market_holiday(now):
              print("NYSE holiday; skipping shadow journal.")
              raise SystemExit(2)
          PY
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "0" ]; then
            exit "$code"
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Refresh ETF prices
        if: ${{ (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        run: python3 refresh_etf_data.py --refresh --force
        env:
          PYTHONUNBUFFERED: "1"

      - name: Require completed factor-data cache
        id: require_factor_cache
        if: ${{ (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        run: |
          if ! python3 factor_data_health.py --strict --no-write; then
            echo "::error::No healthy completed Factor Data Refresh cache was restored. Shadow will not rebuild research data; run Factor Data Refresh first."
            exit 1
          fi
          echo "Restored completed factor-data cache is trade-ready."
        env:
          PYTHONUNBUFFERED: "1"

      - name: Sync Alpaca status for sticky holdings
        if: ${{ (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        run: python3 alpaca_paper_trading.py --status
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run shadow paper journal
        id: run_shadow_journal
        if: ${{ (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.ignore_stale }}" = "true" ]; then
            FLAGS="$FLAGS --ignore-stale"
          fi
          python3 shadow_paper_journal.py $FLAGS
        env:
          PYTHONUNBUFFERED: "1"

      - name: Compare Alpaca paper vs shadow paper
        id: compare_standard_shadow
        if: ${{ (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        run: python3 paper_shadow_compare.py
        env:
          PYTHONUNBUFFERED: "1"

      # This is a second, independent shadow ledger. It reads the restored
      # active signal and writes pretend $400 fractional fills only. The script
      # contains no Alpaca client and cannot submit, cancel, or replace orders.
      - name: Run $400 fractional shadow account
        id: run_fractional_shadow
        if: ${{ (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        run: python3 fractional_shadow_paper.py --initial-equity "$FRACTIONAL_SHADOW_INITIAL_EQUITY"
        env:
          PYTHONUNBUFFERED: "1"
          FRACTIONAL_SHADOW_INITIAL_EQUITY: ${{ github.event.inputs.fractional_initial_equity || '400' }}

      - name: Compare Alpaca paper vs $400 fractional shadow
        id: compare_fractional_shadow
        if: ${{ (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        run: |
          python3 paper_shadow_compare.py \
            --shadow-equity signals/fractional_shadow_equity.csv \
            --csv-out signals/fractional_shadow_compare.csv \
            --json-out signals/fractional_shadow_compare.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Verify shadow evidence and current comparison
        id: verify_shadow_evidence
        if: ${{ (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        env:
          FRACTIONAL_EXPECTED_INITIAL_EQUITY: ${{ github.event.inputs.fractional_initial_equity || '400' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import pandas as pd

          journal = pd.read_csv("signals/shadow_paper_journal.csv")
          if journal.empty:
              raise SystemExit("Shadow journal is empty")
          latest = journal.iloc[-1]
          truthy = lambda value: str(value).strip().lower() in {"true", "1", "yes"}
          if not truthy(latest.get("validation_bundle_valid")):
              raise SystemExit("Shadow validation bundle was not valid")
          if not truthy(latest.get("validation_fingerprint_match")):
              raise SystemExit("Shadow validation config fingerprint did not match")

          comparison_path = Path("signals/paper_shadow_compare.json")
          comparison = json.loads(comparison_path.read_text(encoding="utf-8"))
          if comparison.get("status") not in {"ok", "collecting"}:
              raise SystemExit(f"Paper-vs-shadow comparison is not current: {comparison.get('status')}")
          generated = datetime.fromisoformat(str(comparison["generated_at"]).replace("Z", "+00:00"))
          if generated < datetime.now(timezone.utc) - timedelta(minutes=15):
              raise SystemExit("Paper-vs-shadow comparison is stale")

          fractional = json.loads(Path("signals/fractional_shadow_report.json").read_text(encoding="utf-8"))
          if fractional.get("status") != "ok":
              raise SystemExit(f"Fractional shadow is not healthy: {fractional.get('status')}")
          safety = fractional.get("safety") or {}
          execution = fractional.get("execution") or {}
          if safety.get("shadow_only") is not True or execution.get("broker_orders_submitted") is not False:
              raise SystemExit("Fractional shadow safety invariant failed")
          expected_initial = float(os.environ["FRACTIONAL_EXPECTED_INITIAL_EQUITY"])
          if abs(float((fractional.get("capital") or {}).get("initial_equity", 0)) - expected_initial) > 0.01:
              raise SystemExit("Fractional shadow did not start from the requested capital")
          gap = float((fractional.get("allocation") or {}).get("max_absolute_target_weight_gap", 1))
          if gap > 0.02:
              raise SystemExit(f"Fractional shadow allocation gap is too large: {gap:.2%}")

          fractional_comparison = json.loads(
              Path("signals/fractional_shadow_compare.json").read_text(encoding="utf-8")
          )
          if fractional_comparison.get("status") not in {"ok", "collecting"}:
              raise SystemExit("Fractional paper comparison is not current")
          print("Shadow fingerprint, $400 safety, allocation, and comparisons verified.")
          PY

      - name: Write workflow heartbeat
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          Path("signals").mkdir(exist_ok=True)
          payload = {
              "workflow": "Shadow Paper Journal",
              "workflow_file": "shadow_paper_journal.yml",
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "schedule": os.environ.get("SCHEDULE_CRON") or None,
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "run_url": os.environ.get("RUN_URL"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "status": os.environ.get("WORKFLOW_STATUS"),
              "completed_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }
          Path("signals/workflow_heartbeat_shadow.json").write_text(json.dumps(payload, indent=2))
          PY

      - name: Upload shadow journal artifact
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: shadow-paper-journal-${{ github.run_number }}
          path: |
            signals/shadow_paper_journal.csv
            signals/shadow_paper_equity.csv
            signals/paper_shadow_compare.csv
            signals/paper_shadow_compare.json
            signals/fractional_shadow_state.json
            signals/fractional_shadow_orders.csv
            signals/fractional_shadow_equity.csv
            signals/fractional_shadow_report.json
            signals/fractional_shadow_compare.csv
            signals/fractional_shadow_compare.json
            signals/alpaca_daily_status.json
            signals/workflow_heartbeat_shadow.json
          retention-days: 60

      - name: Commit shadow journal to repo
        if: ${{ success() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tmp_shadow_dir="$(mktemp -d)"
          for f in \
              signals/shadow_paper_journal.csv \
              signals/shadow_paper_equity.csv \
              signals/paper_shadow_compare.csv \
              signals/paper_shadow_compare.json \
              signals/fractional_shadow_state.json \
              signals/fractional_shadow_orders.csv \
              signals/fractional_shadow_equity.csv \
              signals/fractional_shadow_report.json \
              signals/fractional_shadow_compare.csv \
              signals/fractional_shadow_compare.json \
              signals/workflow_heartbeat_shadow.json ; do
            if [ -f "$f" ]; then
              cp "$f" "$tmp_shadow_dir/$(basename "$f")"
            fi
          done
          if [ -f "$tmp_shadow_dir/shadow_paper_journal.csv" ] || [ -f "$tmp_shadow_dir/shadow_paper_equity.csv" ]; then
            git fetch --quiet origin signals/latest:refs/remotes/origin/signals/latest || true
            git checkout -B signals/latest origin/signals/latest 2>/dev/null || git checkout -B signals/latest
            mkdir -p signals
            for f in \
                shadow_paper_journal.csv \
                shadow_paper_equity.csv \
                paper_shadow_compare.csv \
                paper_shadow_compare.json \
                fractional_shadow_state.json \
                fractional_shadow_orders.csv \
                fractional_shadow_equity.csv \
                fractional_shadow_report.json \
                fractional_shadow_compare.csv \
                fractional_shadow_compare.json \
                workflow_heartbeat_shadow.json ; do
              if [ -f "$tmp_shadow_dir/$f" ]; then
                cp "$tmp_shadow_dir/$f" "signals/$f"
                git add -f "signals/$f"
              fi
            done
            git commit -m "signals: $(date -u +%Y-%m-%d) shadow paper journal #${{ github.run_number }}" || echo "No shadow journal changes to commit"
            git push origin signals/latest --force
          else
            echo "No shadow files produced."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save shadow journal state cache
        if: ${{ success() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') && steps.calendar_gate.outputs.should_run == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            signals/shadow_paper_journal.csv
            signals/shadow_paper_equity.csv
            signals/paper_shadow_compare.csv
            signals/paper_shadow_compare.json
            signals/fractional_shadow_state.json
            signals/fractional_shadow_orders.csv
            signals/fractional_shadow_equity.csv
            signals/fractional_shadow_report.json
            signals/fractional_shadow_compare.csv
            signals/fractional_shadow_compare.json
          key: shadow-journal-v2-${{ github.run_id }}

      - name: Publish detailed failure annotation
        if: ${{ failure() }}
        env:
          WORKFLOW_STEPS_JSON: ${{ toJSON(steps) }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 workflow_failure_annotation.py --workflow-file .github/workflows/shadow_paper_journal.yml --workflow-name "Shadow Paper Journal"
