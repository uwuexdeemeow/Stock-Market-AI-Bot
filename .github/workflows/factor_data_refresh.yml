# -- Factor Data Refresh ------------------------------------------------------
#
# Refreshes stock factor parquets and the live feature-quality report before
# the daily paper-trading workflow.  Keeping this separate prevents a slow
# yfinance/research run from blocking broker health, fill checks, and trading.
#
# Schedule: 8:05 AM New York time on weekdays.
#   - Runs before the 9:35 AM daily paper-trading job.
#   - GitHub cron is UTC and does not handle DST, so this workflow schedules
#     both possible UTC times and a gate below runs only the in-season one.
#
# Manual trigger: go to Actions tab -> "Factor Data Refresh" -> "Run workflow".
# -----------------------------------------------------------------------------

name: Factor Data Refresh

on:
  schedule:
    # 12:05 UTC = 8:05 AM New York during daylight saving time.
    # 13:05 UTC = 8:05 AM New York during standard time.
    - cron: "5 12 * * 1-5"
    - cron: "5 13 * * 1-5"

  workflow_dispatch:
    inputs:
      xs_only:
        description: "Only rebuild cross-sectional rank features"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  refresh-factor-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # -- 0. DST-safe schedule gate ---------------------------------
      - name: New York schedule gate
        id: ny_schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - running."
            exit 0
          fi

          NY_OFFSET="$(TZ=America/New_York date +%z)"
          TRIGGER="${{ github.event.schedule }}"
          echo "Trigger cron: ${TRIGGER}"
          echo "New York offset now: ${NY_OFFSET}"

          if [ "${TRIGGER}" = "5 12 * * 1-5" ] && [ "${NY_OFFSET}" = "-0400" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "DST trigger matches 8:05 AM New York - running."
          elif [ "${TRIGGER}" = "5 13 * * 1-5" ] && [ "${NY_OFFSET}" = "-0500" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Standard-time trigger matches 8:05 AM New York - running."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Off-season duplicate trigger - skipping factor refresh."
          fi

      - name: Checkout repository
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Restore data cache
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v4
        with:
          path: data/
          key: data-parquets-${{ github.run_id }}
          restore-keys: |
            data-parquets-

      - name: Restore state cache
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            signals/core_satellite_live_configs.json
            signals/core_satellite_nested_walkforward.json
            signals/core_satellite_alpha_metrics.json
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            logs/feature_ic_shortlist.csv
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: state-files-${{ github.run_id }}
          restore-keys: |
            state-files-

      - name: Create .env from secrets
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          cat <<'ENVEOF' > .env
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          TRADIER_API_TOKEN=${{ secrets.TRADIER_API_TOKEN }}
          TRADIER_USE_SANDBOX=0
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          SENTIMENT_ENGINE_LEVEL=vader
          ENVEOF

      - name: Refresh factor parquets
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          if [ "${{ github.event.inputs.xs_only }}" = "true" ]; then
            python3 research.py --xs-only
          else
            python3 research.py --incremental
          fi
        env:
          PYTHONUNBUFFERED: "1"

      - name: Refresh feature quality report
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 feature_quality_diagnostic.py --top 48
        env:
          PYTHONUNBUFFERED: "1"

      - name: Validate factor data health
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 factor_data_health.py --strict
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload refresh logs
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: factor-data-refresh-logs-${{ github.run_number }}
          path: |
            logs/
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/factor_data_health.json
          retention-days: 30

      - name: Save data cache
        if: ${{ success() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: data/
          key: data-parquets-${{ github.run_id }}

      - name: Save state cache
        if: ${{ success() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            signals/core_satellite_live_configs.json
            signals/core_satellite_nested_walkforward.json
            signals/core_satellite_alpha_metrics.json
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            logs/feature_ic_shortlist.csv
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: state-files-${{ github.run_id }}

      - name: Notify on failure (Telegram)
        if: ${{ failure() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "TELEGRAM_BOT_TOKEN not set - skipping notification"
            exit 0
          fi
          MSG="FAILED: *Factor Data Refresh FAILED*%0A"
          MSG="${MSG}Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})%0A"
          MSG="${MSG}Time: $(date -u '+%Y-%m-%d %H:%M UTC')"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MSG}" \
            || echo "Telegram notification failed (non-fatal)"

      - name: Notify on success (Telegram)
        if: ${{ success() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "TELEGRAM_BOT_TOKEN not set - skipping notification"
            exit 0
          fi
          MSG="OK: *Factor Data Refresh OK*%0A"
          MSG="${MSG}Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})%0A"
          MSG="${MSG}Time: $(date -u '+%Y-%m-%d %H:%M UTC')"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MSG}" \
            || echo "Telegram notification failed (non-fatal)"
