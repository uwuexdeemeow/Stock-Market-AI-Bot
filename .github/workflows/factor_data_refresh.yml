# -- Factor Data Refresh ------------------------------------------------------
#
# Refreshes stock factor parquets and the live feature-quality report before
# the daily paper-trading workflow.  Keeping this separate prevents a slow
# yfinance/research run from blocking broker health, fill checks, and trading.
#
# External trigger: cron-job.org calls workflow_dispatch at 7:30 AM New York
# time on weekdays. GitHub's own cron schedule is intentionally disabled.
#   - Research takes ~60 minutes, so this must start early enough to finish
#     before the 9:35 AM paper-trading job.  7:30 AM start → ~8:30 AM finish
#     gives a full hour of buffer before trading begins.
#
# Manual trigger: go to Actions tab -> "Factor Data Refresh" -> "Run workflow".
# -----------------------------------------------------------------------------

name: Factor Data Refresh

on:
  workflow_dispatch:
    inputs:
      xs_only:
        description: "Only rebuild cross-sectional rank features"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: factor-data-refresh
  cancel-in-progress: false

jobs:
  refresh-factor-data:
    runs-on: ubuntu-latest
    # Full research currently takes about 65 minutes. Leave room for the
    # rolling stress reports that now complete the same validated snapshot.
    timeout-minutes: 120

    steps:
      # -- 0. DST-safe schedule gate ---------------------------------
      - name: New York schedule gate
        id: ny_schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - running."
            exit 0
          fi

          NY_OFFSET="$(TZ=America/New_York date +%z)"
          TRIGGER="${{ github.event.schedule }}"
          echo "Trigger cron: ${TRIGGER}"
          echo "New York offset now: ${NY_OFFSET}"

          if [ "${TRIGGER}" = "30 11 * * 1-5" ] && [ "${NY_OFFSET}" = "-0400" ]; then
            echo "DST trigger matches 7:30 AM New York - running."
          elif [ "${TRIGGER}" = "30 12 * * 1-5" ] && [ "${NY_OFFSET}" = "-0500" ]; then
            echo "Standard-time trigger matches 7:30 AM New York - running."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Off-season duplicate trigger - skipping factor refresh."
            exit 0
          fi

          # Do not suppress cron just because a manual run happened earlier.
          # Concurrency prevents overlap, and downstream health checks are safe
          # to rerun when a manual refresh already happened.
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Restore data cache
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: data/
          key: factor-data-parquets-${{ github.run_id }}
          restore-keys: |
            factor-data-parquets-

      # Restore the generated reports together with their factor parquets.
      # The v4 cache is saved only after factor and robustness gates pass.
      - name: Restore state cache
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            signals/core_satellite_alpha_metrics.json
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/feature_health_profile.json
            signals/feature_health_profile.csv
            signals/feature_research_report.json
            signals/feature_research_summary.csv
            signals/research_run_manifest.json
            logs/feature_ic_shortlist.csv
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: runtime-state-v4-${{ github.run_id }}
          restore-keys: |
            runtime-state-v4-

      - name: Create .env from secrets
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          cat <<'ENVEOF' > .env
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          TRADIER_API_TOKEN=${{ secrets.TRADIER_API_TOKEN }}
          TRADIER_USE_SANDBOX=0
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED=0
          SENTIMENT_ENGINE_LEVEL=vader
          STOCKBOT_SKIP_RESEARCH_SENTIMENT=1
          RESEARCH_INCREMENTAL_WORKERS=4
          ENVEOF

      - name: Refresh factor parquets
        id: refresh_factor_parquets
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          if [ "${{ github.event.inputs.xs_only }}" = "true" ]; then
            python3 research.py --xs-only
          else
            python3 research.py --incremental
          fi
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SKIP_RESEARCH_SENTIMENT: "1"
          RESEARCH_INCREMENTAL_WORKERS: "4"
          # Only the research step sees these keys for a cross-checked repair
          # of one invalid latest stock bar; disagreement still fails closed.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      - name: Ensure survivorship audit inputs
        id: ensure_survivorship_inputs
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          # The newest shared data cache can come from Daily Paper Trading.
          # That cache contains the live universe but older caches may omit the
          # failed/delisted names used only by the survivorship stress test.
          # Rebuild those research-only inputs when none survived the restore.
          # Do this before feature-quality analysis because rebuilt parquet
          # files are inputs to that report's strict freshness check.
          if python3 - <<'PY'
          from survivorship_audit import available_audit_tickers, existing_audit_profiles

          tickers = available_audit_tickers(existing_audit_profiles())
          print("Restored survivorship audit tickers:", tickers)
          raise SystemExit(0 if tickers else 1)
          PY
          then
            python3 survivorship_audit.py --report
          else
            echo "No usable survivorship inputs were restored; rebuilding them now."
            python3 survivorship_audit.py --build --report
          fi

          # Fail here with a direct explanation if the data provider could not
          # recover even one audit history. The later stress script must never
          # be allowed to publish an empty or misleading report.
          python3 - <<'PY'
          from survivorship_audit import available_audit_tickers, existing_audit_profiles

          tickers = available_audit_tickers(existing_audit_profiles())
          if not tickers:
              raise SystemExit("No usable survivorship audit histories could be restored or rebuilt.")
          print("Survivorship audit inputs ready:", tickers)
          PY
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Refresh feature quality report
        id: refresh_feature_quality
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 feature_quality_diagnostic.py --top 48
          python3 feature_health.py --max-specs 48
        env:
          PYTHONUNBUFFERED: "1"

      - name: Validate factor data health
        id: validate_factor_data_health
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          # Keep the strict gate: a bad cache must never look like a good one.
          # Print the report when it blocks the job so the Actions page shows
          # the exact cause instead of only Python's generic exit code 1.
          if ! python3 factor_data_health.py --strict; then
            echo "::error::Factor-data health gate blocked this refresh. Full report follows."
            if [ -f signals/factor_data_health.json ]; then
              python3 -m json.tool signals/factor_data_health.json
            else
              echo "Health report was not written."
            fi
            exit 1
          fi
        env:
          PYTHONUNBUFFERED: "1"

      - name: Refresh ETF reference prices
        id: refresh_etf_prices
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: python3 refresh_etf_data.py --refresh --force --strict
        env:
          PYTHONUNBUFFERED: "1"
          # Only this step sees broker-data credentials for a checked backup
          # bar; research and factor-training steps do not need those secrets.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      - name: Validate final research outputs and prices
        id: validate_research_outputs
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          # The manifest must identify the ETF files after their final refresh.
          python3 research_output_guard.py \
            --write-manifest \
            --command "github-actions factor_data_refresh xs_only=${{ github.event.inputs.xs_only }}"
        env:
          PYTHONUNBUFFERED: "1"

      # Keep each robustness program in its own named step. If one exits with
      # an error, GitHub's public job metadata now identifies the exact program
      # instead of reporting one ambiguous four-command failure.
      - name: Refresh approved-config validation
        id: refresh_core_alpha_validation
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: python3 core_satellite_alpha.py --validation-refresh
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Refresh execution-stress evidence
        id: refresh_execution_stress
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: python3 core_satellite_execution_stress.py
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Refresh survivorship evidence
        id: refresh_survivorship_audit
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: python3 core_satellite_survivorship_audit.py
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Refresh factor-decay evidence
        id: refresh_factor_decay
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: python3 factor_decay_monitor.py
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"

      - name: Verify refreshed robustness evidence
        id: verify_robustness_evidence
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 robustness_review.py --strict
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation_bundle import current_robustness_evidence, load_dataset_context

          # PLAIN ENGLISH: a passing stress score only applies to the exact
          # approved strategy and market data that produced its report.
          approved = json.loads(Path('signals/core_satellite_validation_bundle.json').read_text())
          dataset = load_dataset_context()
          review = current_robustness_evidence(
              expected_config_fingerprint=str(approved.get('config_fingerprint', '')),
              expected_dataset_fingerprint=str(dataset.get('dataset_fingerprint', '')),
          )
          print(json.dumps(review, indent=2))
          raise SystemExit(0 if dataset.get('dataset_fingerprint') and review.get('pass') else 1)
          PY
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload refresh logs
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: factor-data-refresh-logs-${{ github.run_number }}
          path: |
            logs/
            signals/adaptive_factor_weights.json
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/feature_health_profile.json
            signals/feature_health_profile.csv
            signals/feature_research_report.json
            signals/feature_research_summary.csv
            signals/factor_data_health.json
            signals/research_run_manifest.json
            signals/factor_decay_monitor.csv
            logs/survivorship_audit.json
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          retention-days: 30

      - name: Save data cache
        # Research may finish but a later safety gate may block trading.  Keep
        # that freshly built data for the next run; the health report remains
        # the authority that decides whether it is safe to trade.
        if: ${{ always() && steps.refresh_factor_parquets.outcome == 'success' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v6
        with:
          path: data/
          key: factor-data-parquets-${{ github.run_id }}

      # Publish one validated report set for readers of this factor snapshot.
      - name: Save state cache
        # Only publish state after its strict health check passes.  A failed
        # report stays in the run artifact, while later runs keep using the
        # last known-good state rather than inheriting a broken one.
        if: ${{ always() && steps.validate_factor_data_health.outcome == 'success' && steps.validate_research_outputs.outcome == 'success' && steps.refresh_etf_prices.outcome == 'success' && steps.refresh_core_alpha_validation.outcome == 'success' && steps.refresh_execution_stress.outcome == 'success' && steps.ensure_survivorship_inputs.outcome == 'success' && steps.refresh_survivorship_audit.outcome == 'success' && steps.refresh_factor_decay.outcome == 'success' && steps.verify_robustness_evidence.outcome == 'success' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v6
        with:
          path: |
            signals/core_satellite_alpha_metrics.json
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/feature_health_profile.json
            signals/feature_health_profile.csv
            signals/feature_research_report.json
            signals/feature_research_summary.csv
            signals/research_run_manifest.json
            logs/feature_ic_shortlist.csv
            logs/survivorship_audit.json
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: runtime-state-v4-${{ github.run_id }}

      # The daily job must restore prices and their checked reports from the
      # same completed refresh. Separate prefix caches can select different
      # runs after a failed refresh and trigger fingerprint mismatches.
      - name: Save validated paper snapshot
        if: ${{ always() && steps.validate_factor_data_health.outcome == 'success' && steps.validate_research_outputs.outcome == 'success' && steps.refresh_etf_prices.outcome == 'success' && steps.refresh_core_alpha_validation.outcome == 'success' && steps.refresh_execution_stress.outcome == 'success' && steps.ensure_survivorship_inputs.outcome == 'success' && steps.refresh_survivorship_audit.outcome == 'success' && steps.refresh_factor_decay.outcome == 'success' && steps.verify_robustness_evidence.outcome == 'success' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/
            signals/core_satellite_alpha_metrics.json
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/feature_health_profile.json
            signals/feature_health_profile.csv
            signals/feature_research_report.json
            signals/feature_research_summary.csv
            signals/research_run_manifest.json
            logs/feature_ic_shortlist.csv
            logs/survivorship_audit.json
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: validated-factor-snapshot-v1-${{ github.run_id }}

      - name: Send consolidated Telegram summary
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          XS_ONLY_INPUT: ${{ github.event.inputs.xs_only }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set - skipping notification"
            exit 0
          fi

          python3 - <<'PY' > /tmp/telegram_summary.txt
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = os.environ.get("JOB_STATUS", "unknown")
          label = {
              "success": "OK",
              "failure": "FAILED",
              "cancelled": "CANCELLED",
          }.get(status, status.upper())
          # Python 3.12 rejects backslash-escaped quotes inside f-strings.
          # Use datetime instead of shelling out to `date -u`.
          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          lines = [
              f"Factor Data Refresh {label}",
              f"Run #{os.environ.get('RUN_NUMBER', '?')}: {os.environ.get('RUN_URL', '')}",
              f"Time: {now_str}",
          ]
          if os.environ.get("XS_ONLY_INPUT") == "true":
              lines.append("Mode: xs-only")

          health_path = Path("signals/factor_data_health.json")
          if health_path.exists():
              try:
                  health = json.loads(health_path.read_text())
                  status_text = health.get("status") or ("ready" if health.get("factor_data_ready") else "not_ready")
                  latest = health.get("latest_data_date") or health.get("latest_date") or "?"
                  age = health.get("age_trading_days", "?")
                  present = health.get("required_present_count", "?")
                  required = health.get("required_count", "?")
                  lines.append(f"Factor data: {status_text}, latest={latest}, age={age}d")
                  lines.append(f"Required tickers: {present}/{required}")
                  reasons = health.get("reasons") or []
                  if reasons:
                      lines.append("Reasons: " + ", ".join(str(x) for x in reasons[:5]))
              except Exception as exc:
                  lines.append(f"Health report unreadable: {exc}")
          else:
              lines.append("Health report: missing")

          quality_path = Path("signals/feature_quality_report.json")
          if quality_path.exists():
              try:
                  quality = json.loads(quality_path.read_text())
                  grades = quality.get("grade_counts", {})
                  if grades:
                      ordered = " ".join(f"{k}:{grades.get(k, 0)}" for k in ["A", "B", "C", "D", "F"])
                      lines.append(f"Feature grades: {ordered}")
                  if quality.get("n_features") is not None:
                      lines.append(f"Features checked: {quality.get('n_features')}")
              except Exception as exc:
                  lines.append(f"Quality report unreadable: {exc}")
          else:
              lines.append("Quality report: missing")

          manifest_path = Path("signals/research_run_manifest.json")
          if manifest_path.exists():
              try:
                  manifest = json.loads(manifest_path.read_text())
                  validation = manifest.get("validation", {})
                  lines.append(
                      "Research guard: "
                      f"{validation.get('status', 'unknown')} "
                      f"({validation.get('checked_count', '?')} files)"
                  )
                  system = manifest.get("system", {})
                  if system.get("system") and system.get("python_version"):
                      lines.append(
                          f"Runner: {system.get('system')} Python {system.get('python_version')}"
                      )
              except Exception as exc:
                  lines.append(f"Research manifest unreadable: {exc}")
          else:
              lines.append("Research manifest: missing")

          print("\n".join(lines))
          PY

          cat /tmp/telegram_summary.txt
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text@/tmp/telegram_summary.txt" \
            || echo "Telegram notification failed (non-fatal)"

      - name: Publish detailed failure annotation
        if: ${{ failure() }}
        env:
          WORKFLOW_STEPS_JSON: ${{ toJSON(steps) }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 workflow_failure_annotation.py --workflow-file .github/workflows/factor_data_refresh.yml --workflow-name "Factor Data Refresh"
