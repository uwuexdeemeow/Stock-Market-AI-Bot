# -- Factor Data Refresh ------------------------------------------------------
#
# Refreshes stock factor parquets and the live feature-quality report before
# the daily paper-trading workflow.  Keeping this separate prevents a slow
# yfinance/research run from blocking broker health, fill checks, and trading.
#
# Schedule: 7:30 AM New York time on weekdays.
#   - Research takes ~60 minutes, so this must start early enough to finish
#     before the 9:35 AM paper-trading job.  7:30 AM start → ~8:30 AM finish
#     gives a full hour of buffer before trading begins.
#   - GitHub cron is UTC and does not handle DST, so this workflow schedules
#     both possible UTC times and a gate below runs only the in-season one.
#
# Manual trigger: go to Actions tab -> "Factor Data Refresh" -> "Run workflow".
# -----------------------------------------------------------------------------

name: Factor Data Refresh

on:
  schedule:
    # 11:30 UTC = 7:30 AM New York during daylight saving time (EDT, UTC-4).
    # 12:30 UTC = 7:30 AM New York during standard time (EST, UTC-5).
    - cron: "30 11 * * 1-5"
    - cron: "30 12 * * 1-5"

  workflow_dispatch:
    inputs:
      xs_only:
        description: "Only rebuild cross-sectional rank features"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: factor-data-refresh
  cancel-in-progress: false

jobs:
  refresh-factor-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # -- 0. DST-safe schedule gate ---------------------------------
      - name: New York schedule gate
        id: ny_schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - running."
            exit 0
          fi

          NY_OFFSET="$(TZ=America/New_York date +%z)"
          TRIGGER="${{ github.event.schedule }}"
          echo "Trigger cron: ${TRIGGER}"
          echo "New York offset now: ${NY_OFFSET}"

          if [ "${TRIGGER}" = "30 11 * * 1-5" ] && [ "${NY_OFFSET}" = "-0400" ]; then
            echo "DST trigger matches 7:30 AM New York - running."
          elif [ "${TRIGGER}" = "30 12 * * 1-5" ] && [ "${NY_OFFSET}" = "-0500" ]; then
            echo "Standard-time trigger matches 7:30 AM New York - running."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Off-season duplicate trigger - skipping factor refresh."
            exit 0
          fi

          # Do not suppress cron just because a manual run happened earlier.
          # Concurrency prevents overlap, and downstream health checks are safe
          # to rerun when a manual refresh already happened.
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Restore data cache
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v4
        with:
          path: data/
          key: factor-data-parquets-${{ github.run_id }}
          restore-keys: |
            factor-data-parquets-

      # Files now tracked in git are intentionally excluded — caching them
      # would overwrite the known-good baseline checked out from git with
      # a potentially stale cached copy.  See daily_paper_trading.yml for
      # the full list.
      - name: Restore state cache
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            signals/core_satellite_alpha_metrics.json
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: state-files-${{ github.run_id }}
          restore-keys: |
            state-files-

      - name: Create .env from secrets
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          cat <<'ENVEOF' > .env
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          TRADIER_API_TOKEN=${{ secrets.TRADIER_API_TOKEN }}
          TRADIER_USE_SANDBOX=0
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED=0
          SENTIMENT_ENGINE_LEVEL=vader
          STOCKBOT_SKIP_RESEARCH_SENTIMENT=1
          RESEARCH_INCREMENTAL_WORKERS=4
          ENVEOF

      - name: Refresh factor parquets
        id: refresh_factor_parquets
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          if [ "${{ github.event.inputs.xs_only }}" = "true" ]; then
            python3 research.py --xs-only
          else
            python3 research.py --incremental
          fi
        env:
          PYTHONUNBUFFERED: "1"
          STOCKBOT_SKIP_RESEARCH_SENTIMENT: "1"
          RESEARCH_INCREMENTAL_WORKERS: "4"

      - name: Refresh feature quality report
        id: refresh_feature_quality
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 feature_quality_diagnostic.py --top 48
          python3 feature_health.py --max-specs 48
        env:
          PYTHONUNBUFFERED: "1"

      - name: Validate factor data health
        id: validate_factor_data_health
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          # Keep the strict gate: a bad cache must never look like a good one.
          # Print the report when it blocks the job so the Actions page shows
          # the exact cause instead of only Python's generic exit code 1.
          if ! python3 factor_data_health.py --strict; then
            echo "::error::Factor-data health gate blocked this refresh. Full report follows."
            if [ -f signals/factor_data_health.json ]; then
              python3 -m json.tool signals/factor_data_health.json
            else
              echo "Health report was not written."
            fi
            exit 1
          fi
        env:
          PYTHONUNBUFFERED: "1"

      - name: Validate research outputs
        id: validate_research_outputs
        if: ${{ github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true' }}
        run: |
          python3 research_output_guard.py \
            --write-manifest \
            --command "github-actions factor_data_refresh xs_only=${{ github.event.inputs.xs_only }}"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload refresh logs
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: factor-data-refresh-logs-${{ github.run_number }}
          path: |
            logs/
            signals/adaptive_factor_weights.json
            signals/feature_quality_report.json
            signals/feature_quality_summary.csv
            signals/feature_health_profile.json
            signals/feature_health_profile.csv
            signals/feature_research_report.json
            signals/feature_research_summary.csv
            signals/factor_data_health.json
            signals/research_run_manifest.json
          retention-days: 30

      - name: Save data cache
        # Research may finish but a later safety gate may block trading.  Keep
        # that freshly built data for the next run; the health report remains
        # the authority that decides whether it is safe to trade.
        if: ${{ always() && steps.refresh_factor_parquets.outcome == 'success' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: data/
          key: factor-data-parquets-${{ github.run_id }}

      # Git-tracked files excluded — they're owned by main, not cache.
      - name: Save state cache
        # Only publish state after its strict health check passes.  A failed
        # report stays in the run artifact, while later runs keep using the
        # last known-good state rather than inheriting a broken one.
        if: ${{ always() && steps.validate_factor_data_health.outcome == 'success' && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            signals/core_satellite_alpha_metrics.json
            signals/factor_data_health.json
            signals/factor_decay_monitor.csv
            logs/factor_decay_monitor.json
            logs/core_satellite_execution_stress.json
            logs/core_satellite_survivorship_audit.json
          key: state-files-${{ github.run_id }}

      - name: Send consolidated Telegram summary
        if: ${{ always() && (github.event_name != 'schedule' || steps.ny_schedule_gate.outputs.should_run == 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          XS_ONLY_INPUT: ${{ github.event.inputs.xs_only }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set - skipping notification"
            exit 0
          fi

          python3 - <<'PY' > /tmp/telegram_summary.txt
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = os.environ.get("JOB_STATUS", "unknown")
          label = {
              "success": "OK",
              "failure": "FAILED",
              "cancelled": "CANCELLED",
          }.get(status, status.upper())
          # Python 3.12 rejects backslash-escaped quotes inside f-strings.
          # Use datetime instead of shelling out to `date -u`.
          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          lines = [
              f"Factor Data Refresh {label}",
              f"Run #{os.environ.get('RUN_NUMBER', '?')}: {os.environ.get('RUN_URL', '')}",
              f"Time: {now_str}",
          ]
          if os.environ.get("XS_ONLY_INPUT") == "true":
              lines.append("Mode: xs-only")

          health_path = Path("signals/factor_data_health.json")
          if health_path.exists():
              try:
                  health = json.loads(health_path.read_text())
                  status_text = health.get("status") or ("ready" if health.get("factor_data_ready") else "not_ready")
                  latest = health.get("latest_data_date") or health.get("latest_date") or "?"
                  age = health.get("age_trading_days", "?")
                  present = health.get("required_present_count", "?")
                  required = health.get("required_count", "?")
                  lines.append(f"Factor data: {status_text}, latest={latest}, age={age}d")
                  lines.append(f"Required tickers: {present}/{required}")
                  reasons = health.get("reasons") or []
                  if reasons:
                      lines.append("Reasons: " + ", ".join(str(x) for x in reasons[:5]))
              except Exception as exc:
                  lines.append(f"Health report unreadable: {exc}")
          else:
              lines.append("Health report: missing")

          quality_path = Path("signals/feature_quality_report.json")
          if quality_path.exists():
              try:
                  quality = json.loads(quality_path.read_text())
                  grades = quality.get("grade_counts", {})
                  if grades:
                      ordered = " ".join(f"{k}:{grades.get(k, 0)}" for k in ["A", "B", "C", "D", "F"])
                      lines.append(f"Feature grades: {ordered}")
                  if quality.get("n_features") is not None:
                      lines.append(f"Features checked: {quality.get('n_features')}")
              except Exception as exc:
                  lines.append(f"Quality report unreadable: {exc}")
          else:
              lines.append("Quality report: missing")

          manifest_path = Path("signals/research_run_manifest.json")
          if manifest_path.exists():
              try:
                  manifest = json.loads(manifest_path.read_text())
                  validation = manifest.get("validation", {})
                  lines.append(
                      "Research guard: "
                      f"{validation.get('status', 'unknown')} "
                      f"({validation.get('checked_count', '?')} files)"
                  )
                  system = manifest.get("system", {})
                  if system.get("system") and system.get("python_version"):
                      lines.append(
                          f"Runner: {system.get('system')} Python {system.get('python_version')}"
                      )
              except Exception as exc:
                  lines.append(f"Research manifest unreadable: {exc}")
          else:
              lines.append("Research manifest: missing")

          print("\n".join(lines))
          PY

          cat /tmp/telegram_summary.txt
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text@/tmp/telegram_summary.txt" \
            || echo "Telegram notification failed (non-fatal)"

      - name: Publish detailed failure annotation
        if: ${{ failure() }}
        env:
          WORKFLOW_STEPS_JSON: ${{ toJSON(steps) }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 workflow_failure_annotation.py --workflow-file .github/workflows/factor_data_refresh.yml --workflow-name "Factor Data Refresh"
