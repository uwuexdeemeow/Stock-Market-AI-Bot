name: Independent Paper Workflow Watchdog

on:
  schedule:
    # Multiple off-peak attempts make it unlikely that GitHub drops every
    # watchdog event. The script itself decides whether any work is due.
    - cron: "7,17,27,37,47,57 * * * 1-5"
  workflow_dispatch:

permissions:
  # Read run history and manually dispatch a missed workflow. The target
  # workflows keep their own holiday, market-window, and duplicate safeguards.
  actions: write
  contents: read

concurrency:
  group: independent-paper-workflow-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install watchdog dependencies
        run: pip install pandas exchange-calendars

      - name: Restore alert-deduplication state
        uses: actions/cache/restore@v6
        with:
          path: signals/workflow_watchdog_state.json
          key: workflow-watchdog-state-${{ github.run_id }}
          restore-keys: workflow-watchdog-state-

      - name: Check scheduled workflows
        id: check_scheduled_workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python workflow_watchdog.py --json

      - name: Save alert-deduplication state
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: signals/workflow_watchdog_state.json
          key: workflow-watchdog-state-${{ github.run_id }}

      - name: Upload watchdog report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: independent-workflow-watchdog-${{ github.run_number }}
          path: signals/workflow_watchdog*.json
          retention-days: 60

      - name: Publish detailed failure annotation
        if: ${{ failure() }}
        env:
          WORKFLOW_STEPS_JSON: ${{ toJSON(steps) }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 workflow_failure_annotation.py --workflow-file .github/workflows/independent_workflow_watchdog.yml --workflow-name "Independent Paper Workflow Watchdog"
