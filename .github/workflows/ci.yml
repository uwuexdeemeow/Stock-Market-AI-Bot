name: Paper Safety CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt pytest yamllint
      - name: Validate workflow YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' .github/workflows
      - name: Run complete test suite
        env:
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"
        run: pytest -q

  windows-paper-safety:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt pytest
      - name: Run critical Windows safety tests
        env:
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"
        run: >-
          pytest -q
          tests/test_broker_truth.py
          tests/test_brokers.py
          tests/test_daily_run.py
          tests/test_execution_guard.py
          tests/test_monitor_outputs.py
          tests/test_paper_health.py
          tests/test_paper_validation_epoch.py
          tests/test_safe_io.py
          tests/test_run_evidence.py
          tests/test_disaster_recovery.py
          tests/test_workflow_watchdog.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned CI dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements-ci.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
