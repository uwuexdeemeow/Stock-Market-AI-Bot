name: Paper Safety CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt pytest yamllint
      - name: Validate workflow YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' .github/workflows
      - name: Run critical static safety checks
        # PLAIN ENGLISH: Start with bug-prone rules on daily trading code. A
        # narrow gate avoids mixing a large style cleanup into operational fixes.
        run: >-
          python -m ruff check
          daily_run.py
          alpaca_paper_trading.py
          broker_health.py
          execution_guard.py
          alpaca_protection.py
          core_satellite_alpha.py
          sentiment_engine.py
          --select F821,F811,B023
      - name: Validate reviewed paper release
        # Catch a stale release fingerprint before a daily run blocks orders.
        # This only checks; a reviewed release must be frozen deliberately.
        run: python paper_validation_epoch.py --check-lock
      - name: Run complete test suite
        env:
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"
        run: |
          # Preserve pytest's real exit code while publishing the failure tail
          # as a check annotation that is visible without downloading logs.
          set -o pipefail
          set +e
          pytest -q 2>&1 | tee pytest-output.txt
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            details=$(tail -n 80 pytest-output.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=.github/workflows/ci.yml,line=32,title=Linux pytest failure::$details"
          fi
          exit "$test_status"

  windows-paper-safety:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Workflow regression tests parse YAML on Windows as well as Linux.
          pip install -r requirements-ci.txt pytest yamllint
      - name: Run critical Windows safety tests
        env:
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"
        run: >-
          pytest -q
          tests/test_broker_truth.py
          tests/test_brokers.py
          tests/test_daily_run.py
          tests/test_execution_guard.py
          tests/test_monitor_outputs.py
          tests/test_paper_health.py
          tests/test_paper_validation_epoch.py
          tests/test_safe_io.py
          tests/test_run_evidence.py
          tests/test_disaster_recovery.py
          tests/test_workflow_watchdog.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit pinned CI dependencies
        run: |
          pip install pip-audit
          # No inherited vulnerability exceptions remain after replacing the
          # retired broker SDK and the old FinVADER/NLTK dependency chain.
          pip-audit -r requirements-ci.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v3 runs on current GitHub runners. Pass the built-in repository token
      # so the scanner's account lookup does not hit anonymous API limits.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
