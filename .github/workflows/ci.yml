name: Paper Safety CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt pytest yamllint
      - name: Validate workflow YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' .github/workflows
      - name: Run complete test suite
        env:
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"
        run: |
          # Preserve pytest's real exit code while publishing the failure tail
          # as a check annotation that is visible without downloading logs.
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            details=$(tail -n 80 pytest-output.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=.github/workflows/ci.yml,line=32,title=Linux pytest failure::$details"
          fi
          exit "$test_status"

  windows-paper-safety:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt pytest
      - name: Run critical Windows safety tests
        env:
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          STOCKBOT_SCRIPT_TELEGRAM_ENABLED: "0"
        run: >-
          pytest -q
          tests/test_broker_truth.py
          tests/test_brokers.py
          tests/test_daily_run.py
          tests/test_execution_guard.py
          tests/test_monitor_outputs.py
          tests/test_paper_health.py
          tests/test_paper_validation_epoch.py
          tests/test_safe_io.py
          tests/test_run_evidence.py
          tests/test_disaster_recovery.py
          tests/test_workflow_watchdog.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned CI dependencies
        run: |
          pip install pip-audit
          # The legacy Alpaca and FinVADER SDKs hard-pin vulnerable transitive
          # packages. Ignore only their currently unfixable advisories; every
          # new or unrelated vulnerability still fails this job.
          pip-audit -r requirements-ci.txt \
            --ignore-vuln PYSEC-2021-859 \
            --ignore-vuln PYSEC-2021-356 \
            --ignore-vuln PYSEC-2022-5 \
            --ignore-vuln PYSEC-2024-167 \
            --ignore-vuln PYSEC-2026-96 \
            --ignore-vuln PYSEC-2026-97 \
            --ignore-vuln PYSEC-2026-98 \
            --ignore-vuln PYSEC-2026-99 \
            --ignore-vuln PYSEC-2026-597 \
            --ignore-vuln PYSEC-2026-2085 \
            --ignore-vuln PYSEC-2026-2235 \
            --ignore-vuln PYSEC-2026-2236 \
            --ignore-vuln PYSEC-2026-2237 \
            --ignore-vuln PYSEC-2026-3582 \
            --ignore-vuln PYSEC-2026-3583 \
            --ignore-vuln PYSEC-2026-3584 \
            --ignore-vuln PYSEC-2026-3657 \
            --ignore-vuln PYSEC-2026-3722 \
            --ignore-vuln PYSEC-2026-3723 \
            --ignore-vuln PYSEC-2026-3724 \
            --ignore-vuln PYSEC-2026-3625 \
            --ignore-vuln PYSEC-2026-141 \
            --ignore-vuln PYSEC-2026-1999 \
            --ignore-vuln PYSEC-2026-1998 \
            --ignore-vuln PYSEC-2026-1994 \
            --ignore-vuln PYSEC-2026-1996

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
